{% extends "base.html" %}

{% block title %}Triage Copilot — Student Success Center{% endblock %}

{% block content %}

  <main class="panel">

    <form id="predict-form" class="predict-form">
      <label for="student-text" class="field-label">Student Inquiry</label>
      <textarea
        id="student-text"
        name="student-text"
        placeholder="Type or paste what the student said…"
        rows="4"
        required
      ></textarea>
      <button type="submit" id="submit-btn" class="btn btn-primary">Route Request</button>
    </form>

    <div id="error-box" class="error-box" hidden></div>

    <section id="result" class="result" hidden>
      <div class="result-category">
        <span class="result-label">Department Needed:</span>
        <h2 id="result-category-name" class="category-name">—</h2>
      </div>
      <div class="confidence">
        <div class="confidence-track">
          <div id="confidence-fill" class="confidence-fill"></div>
        </div>
        <span id="confidence-text" class="confidence-text">—</span>
      </div>

      <div id="verify-step" class="verify-step">
        <span class="field-label">Is this correct?</span>
        <div class="verify-actions">
          <button type="button" id="confirm-yes" class="btn btn-outline">Yes</button>
          <button type="button" id="confirm-no" class="btn btn-outline">No</button>
        </div>
      </div>

      <div id="correction-step" class="correction-step" hidden>
        <label for="correct-category" class="field-label">Which department is it?</label>
        <select id="correct-category" name="correct-category">
          <option value="Admissions / Enrollment">Admissions / Enrollment</option>
          <option value="Advising">Advising</option>
          <option value="Appointment">Appointment</option>
          <option value="ESL Advising">ESL Advising</option>
          <option value="New Accepted Student / Navigate">New Accepted Student / Navigate</option>
          <option value="Student Financial Services">Student Financial Services</option>
        </select>
        <button type="button" id="save-correction" class="btn btn-primary">Save correction</button>
        <button type="button" id="cancel-correction" class="btn btn-outline">Cancel</button>
      </div>

      <p id="confirmation-msg" class="confirmation-msg" hidden></p>

    </section>

  </main>

{% endblock %}

{% block scripts %}
<script src="/static/app.js"></script>
{% endblock %}
