{% extends "base.html" %}

{% block title %}Knowledge Base — Triage Copilot{% endblock %}

{% block content %}

<div class="kb-container">

  <div class="kb-header">
    <h2 class="category-name">Knowledge Base</h2>
    <p class="field-label">Ask about deadlines, policies, or other documents on file.</p>
  </div>

  <div id="chat-log" class="kb-log">
    <div class="chat-empty">Ask a question below to get started.</div>
  </div>

  <form id="ask-form" class="kb-input-row">
    <textarea
      id="ask-question-input"
      placeholder="Ask a question…"
      rows="1"
      required
    ></textarea>
    <button type="submit" id="ask-btn" class="btn btn-primary">Ask</button>
  </form>

</div>

{% endblock %}

{% block scripts %}
<script src="/static/ask.js"></script>
{% endblock %}
